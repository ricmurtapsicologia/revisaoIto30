name: Sincronizar minuta PDF

on:
  push:
    paths:
      - '.github/workflows/sync-minuta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Exportar minuta do Google Docs em PDF
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docs.google.com/document/d/11RH0jaZOul9qNh7hrTRLXc-DClndHEFW/export?format=pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o minuta-ito30.pdf
          test -s minuta-ito30.pdf
          test "$(stat -c%s minuta-ito30.pdf)" -gt 100000
          head -c 5 minuta-ito30.pdf | grep -q '%PDF-'

      - name: Atualizar PDF no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minuta-ito30.pdf
          if git diff --cached --quiet; then
            echo 'PDF sem alterações.'
            exit 0
          fi
          git commit -m 'Atualiza minuta oficial em PDF'
          git push
